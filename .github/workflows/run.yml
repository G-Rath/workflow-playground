name: run
on:
  push:
  workflow_dispatch:
    inputs:
      case:
        description: Case to run (see gh-annotations-scratch/main.go)
        required: false
        default: all

permissions:
  contents: read # to fetch code (actions/checkout)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gh-annotations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gh-annotations-scratch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gh-annotations-scratch/go.mod
          cache-dependency-path: gh-annotations-scratch/go.sum
      - run: go build -o gh-annotations .
      - run: ./gh-annotations -case "$CASE"
        env:
          CASE: ${{ inputs.case || 'all' }}
